# Git hooks. Docs: https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{ts,tsx,js,mjs}"
      run: pnpm exec next typegen && pnpm exec eslint --max-warnings=0 {staged_files}
    - name: prettier
      glob: "*.{ts,tsx,js,mjs,json,md,css,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
